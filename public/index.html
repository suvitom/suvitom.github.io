<!DOCTYPE html>
<html lang="fi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Helsingin veistokset</title>
  <link rel="stylesheet" href="Frontpage/style.css">

  <!-- fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Savate:wght@200..900&display=swap" rel="stylesheet">
</head>

<body>
  <div id="blocks">
    <div class="side" id="sideLeft"></div>
    <div id="white">
      <h1 id="title"></h1>
      <div id="langcontainer">
        <span class="language" onclick="changeLanguage('fi')">fi</span>
        <span style="padding: 0 4px">|</span>
        <span class="language" onclick="changeLanguage('en')">en</span>
      </div>
      <div id="btncontainer">
        <button id="mapButton" type="button" onclick="window.location.href='Map_page/Map_page.html'">
          <div style="grid-column: 1;"></div>
          <div id="btntext"></div>
          <div id="arrow">➜</div>
          <div style="grid-column: 4;"></div>
        </button>
      </div>
      <div id="chapters"></div>
      <div id="imagecontainer">
        <img id="helsinkiphoto" alt="Kuva Helsingistä"></img>
        <div>
          <a id="photolink" href=""></a>
        </div>
      </div>
    </div>
    <div class="side" id="sideRight"></div>
  </div>
  <script defer src="Frontpage/textcontent.js"></script>
  <script defer src="Frontpage/script.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8" />
    <title>Helsingin veistokset</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://kit.fontawesome.com/0c92469ee5.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">

    <!-- update the version number as needed -->
    <script defer src="https://www.gstatic.com/firebasejs/12.7.0/firebase-app-compat.js"></script>
    <!-- include only the Firebase features as you need -->
    <script defer src="https://www.gstatic.com/firebasejs/12.7.0/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore-compat.js"></script>
    <!-- 
      initialize the SDK after all desired features are loaded, set useEmulator to false
      to avoid connecting the SDK to running emulators.
    -->
    <!-- <script defer src="/__/firebase/init.js?useEmulator=false"></script> -->
</head>

<body>
    <h1 id="title"></h1>
    <button id="back" type="button" onclick="window.location.href='../index.html'"></button>
    <div id="langcontainer">
        <span class="language" onclick="changeLanguage('fi')">fi</span>
        <span style="padding: 0 5px">|</span>
        <span class="language" onclick="changeLanguage('en')">en</span>
    </div>
    <button id="logInOrOut" type="button" onclick="">Loading......</button>
    <div id="main">
        <div id="mapcontainer">
            <div id="map"></div>
            <div id="btncontainer">
                <button onclick="getMyLocation()" id="findMebtn" type="button"></button>
                <span>
                    <label for="opacitySlider" id="opacityLabl"></label>
                    <input type="range" min="4" max="10" value="9" id="opacitySlider">
                </span>
            </div>
        </div>


        <div id="sculptList">
            <div class="rightSideView">
                <div class="browsing dot" onclick="changeRightHandView('browsing')">⬤</div>
                <div class="browsing" onclick="changeRightHandView('browsing')"></div>
                <div></div>
                <!--empty div is for styling-->
            </div>
            <div class="rightSideView">
                <div class="map dot" onclick="changeRightHandView('map')">⬤</div>
                <div class="map" onclick="changeRightHandView('map')"></div>
                <div></div>
            </div>
            <div class="rightSideView">
                <div class="favourites dot" onclick="changeRightHandView('favourites')">⬤</div>
                <div class="favourites" onclick="changeRightHandView('favourites')"></div>
                <div></div>
            </div>
            <div class="rightSideView">
                <div class="top dot" onclick="changeRightHandView('top')">⬤</div>
                <div class="top" onclick="changeRightHandView('top')">Top</div>
                <div></div>
            </div>
            <div id="sideBar">
                <div id="browsingContent">
                    <h3 id="subHeading"></h3>
                    <div id="searchContainer">
                        <input type="text" id="search" placeholder="" autofocus />
                        <div id="artiSearchContainer">
                            <div class="searchBy">
                                <input type="checkbox" id="artistSearch" />
                                <label for="artistSearch" id="artistLabel"><span id="lablTextArtist"></span></label>
                            </div>
                            <div class="searchBy">
                                <input type="checkbox" id="yearSearch" />
                                <label for="yearSearch" id="yearLabel"><span id="lablTextYear"></span></label>
                            </div>
                        </div>
                    </div>
                    <div style="display: flex;">
                        <select id="organize">
                            <option value="1"></option>
                            <option value="2"></option>
                            <option value="3"></option>
                            <option value="4"></option>
                        </select>
                    </div>
                    <div id="list"></div>
                </div>

                <div id="mapContent" style="display:none">
                    <div class="searchBy" style="margin-bottom: 13px">
                        <input type="radio" id="def_radio" name="mapradio" onclick="addSculptures('def_radio', favIds)"
                            checked />
                        <label for="def_radio" id="default"></label>
                    </div>
                    <form autocomplete="off">
                        <label class="labl" for="check1_fav">
                            <input type="checkbox" onclick="addOrRemoveLayer(grpNine, 'check1_fav')" id="check1_fav"
                                checked></input>
                            <span class="legend" style="background-color: red"></span>
                            <span class="years">Suosikit</span>
                        </label>
                        <label class="labl" for="check2_def">
                            <input type="checkbox" onclick="addOrRemoveLayer(grpEight, 'check2_def')" id="check2_def"
                                checked></input>
                            <span class="legend" style="background-color: #ffd942"></span>
                            <span class="years">Muut</span>
                        </label>
                    </form>
                    <br />
                    <div class="searchBy" style="margin-bottom: 13px">
                        <input type="radio" id="cti_radio" name="mapradio"
                            onclick="addSculptures('cti_radio', favIds)" />
                        <label for="cti_radio" id="createdIn"></label>
                    </div>
                    <form autocomplete="off">
                        <label class="labl" for="check1">
                            <input type="checkbox" onclick="addOrRemoveLayer(grpOne, 'check1')" id="check1"
                                checked></input>
                            <span class="legend" style="background-color: #000000"></span>
                            <span class="years">–1826</span>
                        </label>
                        <label class="labl" for="check2">
                            <input type="checkbox" onclick="addOrRemoveLayer(grpTwo, 'check2')" id="check2"
                                checked></input>
                            <span class="legend" style="background-color: #4f4f4f"></span>
                            <span class="years">1827–1866</span>
                        </label>
                        <label class="labl" for="check3">
                            <input type="checkbox" onclick="addOrRemoveLayer(grpThree, 'check3')" id="check3"
                                checked></input>
                            <span class="legend" style="background-color: #94877f"></span>
                            <span class="years">1867–1906</span>
                        </label>
                        <label class="labl" for="check4">
                            <input type="checkbox" onclick="addOrRemoveLayer(grpFour, 'check4')" id="check4"
                                checked></input>
                            <span class="legend" style="background-color: #7d70ba"></span>
                            <span class="years">1907–1946</span>
                        </label>
                        <label class="labl" for="check5">
                            <input type="checkbox" onclick="addOrRemoveLayer(grpFive, 'check5')" id="check5"
                                checked></input>
                            <span class="legend" style="background-color: #6aadd1"></span>
                            <span class="years">1947–1986</span>
                        </label>
                        <label class="labl" for="check6">
                            <input type="checkbox" onclick="addOrRemoveLayer(grpSix, 'check6')" id="check6"
                                checked></input>
                            <span class="legend" style="background-color: thistle"></span>
                            <span class="years">1987–2026</span>
                        </label>
                        <label class="labl" for="check7">
                            <input type="checkbox" onclick="addOrRemoveLayer(grpSeven, 'check7')" id="check7"
                                checked></input>
                            <span class="legend" style="background-color: yellowgreen"></span>
                            <span id="check7-text" class="years"></span>
                        </label>
                    </form>
                </div>
                <div id="favouritesContent" style="display: none">
                    <div id="favNoShow">
                        <span id="here" onclick="goToLoginPage()"></span>
                    </div>
                    <div id="favShow">
                        <div>FAVOURITES</div>
                    </div>
                </div>
                <div id="topContent" style="display: none">top</div>
            </div>
        </div>
    </div>
    <script src="additionalData.js"></script>
    <script src="../firebase-config.js"></script>
    <script src="script1.js"></script>
    <script src="script2.js"></script>
    <script src="script3.js"></script>
    <script src="script4.js"></script>
</body>

</html>
